<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧪 Shell Integración — Operaciones + Catálogo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Barra del Shell ─────────────────────────── */
    .shell-bar {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }
    .shell-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .shell-badge {
      background: #ef4444;
      color: white;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .shell-badge.live {
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.6; }
    }

    /* Bus de eventos */
    .event-log {
      font-family: monospace;
      font-size: 0.78rem;
      background: #000;
      color: #10b981;
      padding: 4px 14px;
      border-radius: 6px;
      max-width: 380px;
      height: 28px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      transition: all 0.3s;
    }
    .event-log.flash {
      background: #052e16;
      color: #4ade80;
    }

    /* ── Layout de dos columnas ─────────────────── */
    .shell-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Panel izquierdo: MFE Operaciones */
    .panel-operaciones {
      width: 320px;
      min-width: 280px;
      border-right: 1px solid #334155;
      overflow-y: auto;
      flex-shrink: 0;
      background: #f1f5f9;
    }

    /* Panel derecho: MFE Catálogo */
    .panel-catalogo {
      flex: 1;
      overflow-y: auto;
      background: #f0fdf4;
    }

    /* Etiquetas de panel */
    .panel-label {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 6px 14px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-label--op  { background: #0f172a; color: #4ade80; }
    .panel-label--cat { background: #052e16; color: #4ade80; }

    /* Contenedores de los MFEs */
    #mfe-operaciones { min-height: calc(100vh - 110px); }
    #mfe-catalogo    { min-height: calc(100vh - 110px); }

    /* Loading spinner */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: #64748b;
      font-size: 0.9rem;
      gap: 10px;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #334155;
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ── BARRA DEL SHELL ────────────────────────────────── -->
  <header class="shell-bar">
    <div class="shell-title">
      <span class="shell-badge live">● LIVE</span>
      App Shell AgroCesar — Integración Operaciones ↔ Catálogo
    </div>
    <div id="event-log" class="event-log">Esperando eventos...</div>
  </header>

  <!-- ── LAYOUT DIVIDIDO ───────────────────────────────── -->
  <div class="shell-layout">

    <!-- Panel Operaciones (izquierda) -->
    <section class="panel-operaciones">
      <div class="panel-label panel-label--op">
        📦 MFE Operaciones (Productor)
      </div>
      <div id="mfe-operaciones">
        <div class="loading">
          <div class="spinner"></div> Cargando MFE Operaciones...
        </div>
      </div>
    </section>

    <!-- Panel Catálogo (derecha) -->
    <section class="panel-catalogo">
      <div class="panel-label panel-label--cat">
        🛒 MFE Catálogo (Marketplace)
      </div>
      <div id="mfe-catalogo">
        <div class="loading">
          <div class="spinner"></div> Cargando MFE Catálogo...
        </div>
      </div>
    </section>

  </div>

  <!-- ══════════════════════════════════════════════════
       CARGA DE AMBOS MFEs COMO MÓDULOS ES
       Cambia las URLs por las de Netlify cuando estén desplegadas.
  ══════════════════════════════════════════════════ -->
  <script type="module">
    // ── URLs de los MFEs ─────────────────────────────────────────────────────
    // Cambia estas URLs a las de Netlify cuando estén desplegadas:
    //   const OP_URL  = 'https://agrocesar-operaciones.netlify.app/main.js';
    //   const CAT_URL = 'https://agrocesar-catalogo.netlify.app/main.js';
    //
    // Para prueba local (usa npx serve en cada carpeta):
    const OP_URL  = 'https://agrocesar-operaciones.netlify.app/main.js';
    const CAT_URL = 'https://agrocesar-catalogo.netlify.app/main.js';

    const logEl = document.getElementById('event-log');

    // ── Logger del bus de eventos ─────────────────────────────────────────────
    function flashLog(msg) {
      logEl.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.classList.add('flash');
      setTimeout(() => logEl.classList.remove('flash'), 600);
    }

    // ── Interceptar eventos del Event Bus ────────────────────────────────────
    window.addEventListener('producto:publicado', (e) => {
      flashLog(`📦 producto:publicado → "${e.detail.nombre}" ($${e.detail.precio?.toLocaleString('es-CO')})`);
      console.log('[Shell] producto:publicado recibido:', e.detail);
    });

    window.addEventListener('carrito:agregado', (e) => {
      flashLog(`🛒 carrito:agregado → "${e.detail.nombre}"`);
      console.log('[Shell] carrito:agregado recibido:', e.detail);
    });

    // ── Cargar MFE Operaciones ────────────────────────────────────────────────
    try {
      await import(OP_URL);
      window.mountAgroOperaciones('mfe-operaciones', {
        usuario: { nombre: 'Demo Productor', rol: 'productor' }
      });
      console.info('[Shell] ✅ MFE Operaciones montado');
    } catch (err) {
      document.getElementById('mfe-operaciones').innerHTML =
        `<div class="loading" style="color:#ef4444;">❌ Error cargando MFE Operaciones<br><small>${err.message}</small></div>`;
      console.error('[Shell] Error MFE Operaciones:', err);
    }

    // ── Cargar MFE Catálogo ───────────────────────────────────────────────────
    try {
      await import(CAT_URL);
      window.mountAgroCatalogo('mfe-catalogo', {
        bffUrl: 'https://api.agrocesar.com/v1'
      });
      console.info('[Shell] ✅ MFE Catálogo montado');
    } catch (err) {
      document.getElementById('mfe-catalogo').innerHTML =
        `<div class="loading" style="color:#ef4444;">❌ Error cargando MFE Catálogo<br><small>${err.message}</small></div>`;
      console.error('[Shell] Error MFE Catálogo:', err);
    }
  </script>

</body>
</html>
